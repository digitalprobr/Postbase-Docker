; ─────────────────────────────────────────────────────────────────────────────
; Supervisord config for the Postbase all-in-one image.
;
; Runs the embedded PostgreSQL server and the Next.js app in the same
; container. `pg-server` is a symlink created by docker/entrypoint.sh pointing
; at the real `postgres` binary (its location depends on the Alpine package
; layout, e.g. /usr/libexec/postgresql18/postgres).
; ─────────────────────────────────────────────────────────────────────────────
[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgres]
command=/usr/local/bin/pg-server -D /data/postgres
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:app]
command=/usr/local/bin/node /app/apps/web/server.js
autostart=true
autorestart=true
priority=20
startsecs=5
startretries=10
; inheritenv=true is required so DATABASE_URL / NEXTAUTH_* / POSTBASE_JWT_SECRET
; exported by the entrypoint reach the app process.
environment=NODE_ENV="production",HOSTNAME="0.0.0.0"
inheritenv=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
